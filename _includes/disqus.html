{% comment %}
  Disqus is loaded on click rather than on page load. The embed pulls in a few
  hundred KB of third-party script and tanks Largest Contentful Paint on the
  article pages, which is exactly what we are optimising for here.
{% endcomment %}

<section class="disqus">
  <button
    type="button"
    class="comments-toggle"
    id="loadComments"
    aria-controls="disqus_thread"
    aria-expanded="false"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2.678 11.894a1 1 0 0 1 .287.801 10.97 10.97 0 0 1-.398 2c1.395-.323 2.247-.697 2.634-.893a1 1 0 0 1 .71-.074A8.06 8.06 0 0 0 8 14c3.996 0 7-2.807 7-6 0-3.192-3.004-6-7-6S1 4.808 1 8c0 1.468.617 2.83 1.678 3.894m-.493 3.905a22 22 0 0 1-.713.129c-.2.032-.352-.176-.273-.362a10 10 0 0 0 .244-.637l.003-.01c.248-.72.45-1.548.524-2.319C.743 11.37 0 9.76 0 8c0-3.866 3.582-7 8-7s8 3.134 8 7-3.582 7-8 7a9 9 0 0 1-2.087-.24 11 11 0 0 1-3.728 1.04z"/></svg>
    Show comments
  </button>

  <div id="disqus_thread"></div>

  <noscript>
    Please enable JavaScript to view the
    <a href="https://disqus.com/?ref_noscript" rel="nofollow noopener">comments powered by Disqus.</a>
  </noscript>

  <script>
    (function () {
      var btn = document.getElementById("loadComments");
      if (!btn) return;
      btn.addEventListener("click", function () {
        window.disqus_shortname = "{{ site.disqus }}";
        var dsq = document.createElement("script");
        dsq.type = "text/javascript";
        dsq.async = true;
        dsq.src = "https://{{ site.disqus }}.disqus.com/embed.js";
        (document.getElementsByTagName("head")[0] ||
          document.getElementsByTagName("body")[0]).appendChild(dsq);
        btn.setAttribute("aria-expanded", "true");
        btn.style.display = "none";
      });
    })();
  </script>
</section>
